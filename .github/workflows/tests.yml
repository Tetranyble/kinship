name: tests

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer check

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^9.0'
            testbench: '^7.0'
            phpunit: '^9.5'
          - php: '8.2'
            laravel: '^10.0'
            testbench: '^8.0'
            phpunit: '^10.0'
          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'
            phpunit: '^11.0'
          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'
            phpunit: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Select framework version
        run: >-
          composer require --no-update --no-interaction
          "illuminate/auth:${{ matrix.laravel }}"
          "illuminate/contracts:${{ matrix.laravel }}"
          "illuminate/database:${{ matrix.laravel }}"
          "illuminate/http:${{ matrix.laravel }}"
          "illuminate/routing:${{ matrix.laravel }}"
          "illuminate/session:${{ matrix.laravel }}"
          "illuminate/support:${{ matrix.laravel }}"
      - name: Select test tools
        run: >-
          composer require --dev --no-update --no-interaction
          "orchestra/testbench:${{ matrix.testbench }}"
          "phpunit/phpunit:${{ matrix.phpunit }}"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer test
